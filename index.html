<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Költségeim</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Költségeim">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Költségeim</h1>
    <span id="halozat" class="jelzo" hidden>offline</span>
  </header>

  <form id="urlap" autocomplete="off">
    <label class="osszeg-mezo">
      <input id="osszeg" type="text" inputmode="numeric" placeholder="0" aria-label="Összeg" required>
      <span>Ft</span>
    </label>

    <input id="nev" type="text" placeholder="Mire? (pl. ebéd, mozi)" aria-label="Megnevezés" maxlength="100">

    <div id="kategoriak" class="kategoriak" role="radiogroup" aria-label="Kategória"></div>

    <button id="mentes" type="submit">Mentés</button>
  </form>

  <p id="uzenet" class="uzenet" role="status" aria-live="polite"></p>

  <section>
    <h2>Legutóbbiak</h2>
    <ul id="lista" class="lista"></ul>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
