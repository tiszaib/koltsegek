<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Költségeim</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Költségeim">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Költségeim</h1>
    <div class="fejlec-jobb">
      <span id="halozat" class="jelzo" hidden>offline</span>
      <button id="beallitasGomb" class="ikon-gomb" type="button" aria-label="Beállítások" title="Beállítások">⚙︎</button>
    </div>
  </header>

  <section id="beallitas" class="beallitas" hidden>
    <h2 class="beallitas-cim">Melyik táblázatba mentsek?</h2>
    <p>Illeszd be a saját Google Táblázatod szkriptjének címét. Ezt a telepítéskor kaptad, és <code>/exec</code>-re végződik.</p>
    <form id="beallitasUrlap" autocomplete="off">
      <input id="cim" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" aria-label="A szkript címe" required>
      <button id="cimMentes" type="submit">Összekötés</button>
      <button id="megse" type="button" class="masodlagos" hidden>Mégse</button>
    </form>
    <p id="beallitasUzenet" class="uzenet" role="status" aria-live="polite"></p>
    <p class="halvany">Még nincs saját táblázatod? Kérd el az útmutatót attól, akitől az appot kaptad.</p>
  </section>

  <div id="fooldal">

  <form id="urlap" autocomplete="off">
    <label class="osszeg-mezo">
      <input id="osszeg" type="text" inputmode="numeric" placeholder="0" aria-label="Összeg" required>
      <span>Ft</span>
    </label>

    <input id="nev" type="text" placeholder="Mire? (pl. ebéd, mozi)" aria-label="Megnevezés" maxlength="100">

    <div id="kategoriak" class="kategoriak" role="radiogroup" aria-label="Kategória"></div>

    <button id="mentes" type="submit">Mentés</button>
  </form>

  <p id="uzenet" class="uzenet" role="status" aria-live="polite"></p>

  <section>
    <h2>Legutóbbiak</h2>
    <ul id="lista" class="lista"></ul>
  </section>
  </div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
